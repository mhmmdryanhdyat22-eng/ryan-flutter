name: listview_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  simple_alert_dialog: ^1.0.1
  salomon_bottom_bar: ^3.3.2
  cherry_toast: ^1.13.0
  fluttertoast: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/bg.jpg
    - assets/profile.jpg
    - assets/photo.jpg
    - assets/beranda.jpg
    - assets/live.jpg

  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Bold.ttf